name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test --configuration Release
      - name: Publish single-file EXE
        run: >
          dotnet publish src/BPM.App/BPM.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output publish
      - name: Package
        shell: pwsh
        run: |
          $package = "BPM-${{ github.ref_name }}-win-x64.zip"
          Compress-Archive -Path publish/* -DestinationPath $package
          $digest = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$package.sha256", "$digest  $package`n", [Text.UTF8Encoding]::new($false))
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: BPM ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            BPM-${{ github.ref_name }}-win-x64.zip
            BPM-${{ github.ref_name }}-win-x64.zip.sha256
          fail_on_unmatched_files: true
